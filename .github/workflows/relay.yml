name: Collect and publish approved relay
on:
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-publication
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.RELAY_PUBLICATION_APPROVED == 'true' &&
      vars.LIVE_API_VERIFIED == 'true' &&
      vars.RELAY_DELIVERY == 'r2'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: relay-production
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELAY_PUBLICATION_APPROVED: ${{ vars.RELAY_PUBLICATION_APPROVED }}
      RELAY_DELIVERY: ${{ vars.RELAY_DELIVERY }}
      ALLOW_EMPTY_BASELINE: ${{ vars.ALLOW_EMPTY_BASELINE }}
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Read public source with native Git
        env:
          RELAY_REF: ${{ github.ref }}
          RELAY_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$RELAY_REF" = refs/heads/main
          [[ "$RELAY_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/relay-empty-template"
          git init --quiet --template="$RUNNER_TEMP/relay-empty-template" .
          git remote add origin https://github.com/huchuprincess/deungdae-relay.git
          git -c credential.helper= -c core.hooksPath=/dev/null -c protocol.file.allow=never fetch --quiet --no-tags origin "$RELAY_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$RELAY_SHA"
          git -c core.hooksPath=/dev/null checkout --quiet --detach "$RELAY_SHA"
      - name: Tests and candidate audit
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/check_candidate.py
      - name: Read last valid published snapshot
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 -m relay.storage seed --delivery "$RELAY_DELIVERY"
          --previous .runtime/previous.json --receipt .runtime/receipt.json
      - name: Collect the two public feeds
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          LIVE_API_VERIFIED: ${{ vars.LIVE_API_VERIFIED }}
        run: >-
          python3 -m relay.run --mode live --previous .runtime/previous.json
          --output .runtime/latest.json
      - name: Publish one atomic R2 object
        if: vars.RELAY_DELIVERY == 'r2'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 -m relay.storage publish --delivery r2
          --previous .runtime/previous.json --receipt .runtime/receipt.json
          --snapshot .runtime/latest.json
