name: Validate public candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Read public source with native Git
        env:
          RELAY_REF: ${{ github.ref }}
          RELAY_SHA: ${{ github.sha }}
        run: |
          set -eu
          [[ "$RELAY_REF" =~ ^refs/heads/main$|^refs/pull/[0-9]+/merge$ ]]
          [[ "$RELAY_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/relay-empty-template"
          git init --quiet --template="$RUNNER_TEMP/relay-empty-template" .
          git remote add origin https://github.com/huchuprincess/deungdae-relay.git
          git -c credential.helper= -c core.hooksPath=/dev/null -c protocol.file.allow=never fetch --quiet --no-tags origin "$RELAY_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$RELAY_SHA"
          git -c core.hooksPath=/dev/null checkout --quiet --detach "$RELAY_SHA"
      - name: Test without credentials
        run: python3 -m unittest discover -s tests -v
      - name: Audit files, configuration and all Git objects
        run: python3 scripts/check_candidate.py
